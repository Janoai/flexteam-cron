name: Cron

# Reserve voor de server (DESKTOP-TKENI2Q): roept beveiligde endpoints aan op schema.
# De sleutel staat als repo-secret. Publiek repo => publieke logs: NOOIT response-inhoud
# loggen, alleen statuscode. Dubbel draaien met de server is veilig (slot in de app).
# GitHub zet een geplande workflow uit na 60 dagen zonder activiteit (gebeurd op 19/09/2026,
# pas ontdekt op 01/11/2026). Daarom de maandelijkse job blijf-wakker; de wachthond op de
# server kijkt bovendien elke dag of deze workflow nog actief is en zet hem anders terug aan.

on:
  schedule:
    - cron: "*/30 * * * *"   # mail-poll + mail-to-tl
    - cron: "30 5 * * *"     # daily-check (05:30 UTC = 06:30 BE wintertijd, 07:30 zomertijd)
    - cron: "17 4 1 * *"     # blijf-wakker, de 1e van de maand
  workflow_dispatch: {}

jobs:
  mail-poll:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "x-key: ${{ secrets.FLEXTEAM_KEY }}" \
            "https://flexteam-cockpit.pages.dev/api/mail-poll")
          echo "mail-poll HTTP $code"
          [ "$code" = "200" ]
      - name: Koppel mails aan Teamleader
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "x-key: ${{ secrets.FLEXTEAM_KEY }}" \
            "https://flexteam-cockpit.pages.dev/api/mail-to-tl")
          echo "mail-to-tl HTTP $code"
          [ "$code" = "200" ]

  daily-check:
    if: github.event.schedule == '30 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "x-key: ${{ secrets.FLEXTEAM_KEY }}" \
            "https://flexteam-cockpit.pages.dev/api/daily-check")
          echo "HTTP $code"
          [ "$code" = "200" ]

  blijf-wakker:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: write
    steps:
      - name: Workflow actief houden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cron.yml/enable"
      - uses: actions/checkout@v4
      - name: Activiteit in de repo
        run: |
          date -u +%Y-%m-%dT%H:%MZ > laatst-wakker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laatst-wakker.txt
          git commit -m "Blijf wakker" && git push